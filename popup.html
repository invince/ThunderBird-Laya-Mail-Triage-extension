<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { font: 12px system-ui, sans-serif; width: 340px; margin: 0; padding: 10px; }
  h1 { font-size: 13px; margin: 0 0 6px; }
  label { display: block; margin: 6px 0 2px; font-weight: 600; }
  input[type=text], input[type=password], input[type=number], select {
    width: 100%; box-sizing: border-box; padding: 3px 5px;
  }
  .row { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  button { padding: 4px 8px; cursor: pointer; font-size: 12px; }
  #status { margin-top: 8px; font-size: 12px; min-height: 16px; }
  #pwrap { margin-top: 6px; height: 6px; background: color-mix(in srgb, currentColor 18%, transparent); border-radius: 3px; overflow: hidden; display: none; }
  #pbar { height: 100%; width: 0; background: #2e7d32; transition: width .15s linear; }
  #results { margin-top: 8px; max-height: 220px; overflow: auto; font-size: 12px; }
  .item { border-top: 1px solid color-mix(in srgb, currentColor 20%, transparent); padding: 4px 0; }
  .junk { color: #c0392b; font-weight: 700; }
  .ok { color: #2e7d32; }
  .meta { opacity: .7; }
</style>
</head>
<body>
  <h1>Laya Mail Triage</h1>

  <label>Server URL</label>
  <input id="serverUrl" type="text" placeholder="http://127.0.0.1:8010">

  <label>API key</label>
  <input id="apiKey" type="password" placeholder="(from ~/.config/laya/api_key)">

  <label>Categories (comma-separated)</label>
  <input id="categories" type="text" placeholder="personal, work, shopping, ads">

  <label>Spam tag name</label>
  <input id="spamLabel" type="text" placeholder="Spam">

  <label>Processed tag (marks handled mail)</label>
  <input id="processedTag" type="text" placeholder="LayaDone">

  <label>Spam threshold</label>
  <input id="spamThreshold" type="number" min="0" max="1" step="0.05">

  <div class="row">
    <input id="autoTag" type="checkbox">
    <label for="autoTag" style="margin:0;font-weight:400">Round 1: auto-tag category</label>
  </div>
  <div class="row">
    <input id="autoSpam" type="checkbox">
    <label for="autoSpam" style="margin:0;font-weight:400">Round 2: flag spam (tag + junk)</label>
  </div>
  <div class="row">
    <input id="dryRun" type="checkbox">
    <label for="dryRun" style="margin:0;font-weight:400">Dry run (don't change anything)</label>
  </div>
  <div class="row">
    <input id="captureCorrections" type="checkbox">
    <label for="captureCorrections" style="margin:0;font-weight:400">Capture corrections (build a fine-tuning dataset)</label>
  </div>

  <label>Scan inbox</label>
  <select id="inboxSel">
    <option value="all">All inboxes</option>
  </select>

  <div class="row" style="margin-top:10px">
    <button id="save">Save</button>
    <button id="test">Test</button>
    <button id="scan">Scan</button>
  </div>
  <div class="row">
    <button id="showlog">Log</button>
    <button id="exportfixes">Export</button>
    <button id="clearlog">Clear log</button>
    <button id="clearfixes">Clear fixes</button>
  </div>

  <div id="status"></div>
  <div id="pwrap"><div id="pbar"></div></div>
  <div id="results"></div>

  <script src="popup.js"></script>
</body>
</html>
